<style>
  .distort-effect {
    filter: url(#distort);
  }

  body {
    overflow-x: hidden;
  }

  .distorted {
    transform: skewX(-3deg) scale(1.02);
    filter: contrast(1.2) saturate(1.4);
  }
</style>

<svg width="0" height="0" style="position:absolute">
  <filter id="distort">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.015"
      numOctaves="2"
      seed="8"
      result="noise"
    />
    <feDisplacementMap
      in="SourceGraphic"
      in2="noise"
      scale="18"
      xChannelSelector="R"
      yChannelSelector="G"
    />
  </filter>
</svg>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("distort-effect");

    document.querySelectorAll(
      ".section, .container, .div-block, img, h1, h2, h3, p"
    ).forEach(el => {
      el.classList.add("distorted");
    });
  });
</script>
